name: AppNhanVienIOS
options:
  bundleIdPrefix: uk.denncoffee
  deploymentTarget:
    iOS: "16.0"
settings:
  DEVELOPMENT_TEAM: ""
targets:
  AppNhanVienIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Chi Tiêu
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Chụp ảnh hoá đơn mua hàng để đọc tự động vào Chi tiêu, và chụp ảnh món cho menu.
        NSPhotoLibraryUsageDescription: Chọn ảnh hoá đơn để đọc vào Chi tiêu, và chọn ảnh món để cập nhật ảnh menu.
        NSPhotoLibraryAddUsageDescription: Lưu ảnh và video nhập từ máy quầy vào thư viện Ảnh.
        NSLocalNetworkUsageDescription: Kết nối máy quầy trong cùng Wi-Fi để nhập ảnh.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.denncoffee.appnhanvien
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # aps-environment cho push đơn mới/sửa/xoá — export app-store tự đổi development → production.
        CODE_SIGN_ENTITLEMENTS: AppNhanVienIOS.entitlements
    scheme:
      testTargets:
        - AppNhanVienIOSTests
  AppNhanVienIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AppNhanVienIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.denncoffee.appnhanvien.tests
        SWIFT_VERSION: "5.0"
