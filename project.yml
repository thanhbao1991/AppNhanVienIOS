name: AppNhanVienIOS
options:
  bundleIdPrefix: uk.denncoffee
  deploymentTarget:
    iOS: "16.0"
settings:
  DEVELOPMENT_TEAM: ""
targets:
  AppNhanVienIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Chi Tiêu
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSCameraUsageDescription: Chụp ảnh hoá đơn mua hàng để đọc tự động vào Chi tiêu.
        NSPhotoLibraryUsageDescription: Chọn ảnh hoá đơn mua hàng để đọc tự động vào Chi tiêu.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.denncoffee.appnhanvienios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
    scheme:
      testTargets:
        - AppNhanVienIOSTests
  AppNhanVienIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AppNhanVienIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.denncoffee.appnhanvienios.tests
        SWIFT_VERSION: "5.0"
