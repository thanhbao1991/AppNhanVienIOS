name: AppNhanVienIOS
options:
  bundleIdPrefix: uk.denncoffee
  deploymentTarget:
    iOS: "16.0"
settings:
  DEVELOPMENT_TEAM: ""
targets:
  AppNhanVienIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Chi Tiêu
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Chụp ảnh hoá đơn mua hàng để đọc tự động vào Chi tiêu, và chụp ảnh món cho menu.
        NSPhotoLibraryUsageDescription: Chọn ảnh hoá đơn để đọc vào Chi tiêu, và chọn ảnh món để cập nhật ảnh menu.
        NSPhotoLibraryAddUsageDescription: Lưu ảnh và video nhập từ máy quầy vào thư viện Ảnh.
        NSLocalNetworkUsageDescription: Kết nối máy quầy trong cùng Wi-Fi để nhập ảnh.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Icon dịp lễ (2026-11-08, cùng bộ icon app khách/AppQuanLy): đổi sang AppIcon-<MA> theo dịp (xem DipLe.swift).
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            AppIcon-NOEL:
              CFBundleIconName: AppIcon-NOEL
            AppIcon-VALENTINE:
              CFBundleIconName: AppIcon-VALENTINE
            AppIcon-TETAL:
              CFBundleIconName: AppIcon-TETAL
            AppIcon-TETDUONG:
              CFBundleIconName: AppIcon-TETDUONG
            AppIcon-QTPHUNU:
              CFBundleIconName: AppIcon-QTPHUNU
            AppIcon-PHUNUVN:
              CFBundleIconName: AppIcon-PHUNUVN
            AppIcon-GIOTO:
              CFBundleIconName: AppIcon-GIOTO
            AppIcon-GIAIPHONG:
              CFBundleIconName: AppIcon-GIAIPHONG
            AppIcon-THIEUNHI:
              CFBundleIconName: AppIcon-THIEUNHI
            AppIcon-DOANNGO:
              CFBundleIconName: AppIcon-DOANNGO
            AppIcon-THUONGBINH:
              CFBundleIconName: AppIcon-THUONGBINH
            AppIcon-VULAN:
              CFBundleIconName: AppIcon-VULAN
            AppIcon-QUOCKHANH:
              CFBundleIconName: AppIcon-QUOCKHANH
            AppIcon-TRUNGTHU:
              CFBundleIconName: AppIcon-TRUNGTHU
            AppIcon-NHAGIAO:
              CFBundleIconName: AppIcon-NHAGIAO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.denncoffee.appnhanvien
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # aps-environment cho push đơn mới/sửa/xoá — export app-store tự đổi development → production.
        CODE_SIGN_ENTITLEMENTS: AppNhanVienIOS.entitlements
    scheme:
      testTargets:
        - AppNhanVienIOSTests
  AppNhanVienIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AppNhanVienIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.denncoffee.appnhanvien.tests
        SWIFT_VERSION: "5.0"
